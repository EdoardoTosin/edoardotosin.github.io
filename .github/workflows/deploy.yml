name: Deploy Jekyll site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Bundler
        run: |
          echo "BUNDLE_FORCE_RUBY_PLATFORM=true" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run Node.js tests
        run: npm run test:node

      - name: Run Ruby tests
        run: npm run test:ruby

      - name: Audit dependencies
        run: npm run audit:deps

  build:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Bundler
        run: |
          echo "BUNDLE_FORCE_RUBY_PLATFORM=true" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Synchronize vendor assets
        run: npm run assets:sync

      - name: Verify vendor assets are committed
        shell: bash
        run: |
          git diff --exit-code -- assets/js/

          untracked_files="$(git ls-files --others --exclude-standard -- assets/js/)"

          if [[ -n "$untracked_files" ]]; then
            echo "::error::Untracked vendor assets detected. Run npm run assets:sync and commit the generated files."
            printf '%s\n' "$untracked_files"
            exit 1
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: npm run build -- --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Minify JavaScript and CSS
        run: npm run assets:minify

      - name: Run accessibility audit
        run: npm run audit

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
